crons:
  - name: monthly-invoices
    description: "Generate dan email tagihan bulanan per siswa ke semua sekolah tiap tanggal 1 (07:00 WIB)"
    cron: "0 0 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/monthly-invoices"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: invoice-reminders
    description: "Kirim pengingat email/WA untuk invoice belum lunas berumur H+10, diulang tiap 7 hari (08:00 WIB)"
    cron: "0 1 * * *"
    endpoint: "{{BASE_URL}}/api/cron/invoice-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-parent-summary
    description: "Ringkasan absensi mingguan (Senin-Minggu) per siswa ke orang tua via WA tiap Jumat 17:00 WIB (aktif kirim jika Wablas terkonfigurasi)"
    cron: "0 10 * * 5"
    endpoint: "{{BASE_URL}}/api/cron/weekly-parent-summary"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: spp-reminders
    description: "Pengingat WA tagihan SPP mendekati jatuh tempo (H-3 & H-1) ke orang tua, harian 09:00 WIB (aktif kirim jika Wablas terkonfigurasi)"
    cron: "0 2 * * *"
    endpoint: "{{BASE_URL}}/api/cron/spp-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: auto-alpa
    description: "Finalisasi absensi harian: tandai Alpa siswa tanpa absen masuk + kunci otomatis semua sesi absen mapel hari ini, Sen-Sab 19:00 WIB (per zona waktu sekolah)"
    cron: "0 12 * * 1-6"
    endpoint: "{{BASE_URL}}/api/cron/auto-alpa"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
