crons:
  - name: monthly-invoices
    description: "Generate dan email tagihan bulanan per siswa ke semua sekolah tiap tanggal 1 (07:00 WIB)"
    cron: "0 0 1 * *"
    endpoint: "{{BASE_URL}}/api/cron/monthly-invoices"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: invoice-reminders
    description: "Kirim pengingat email/WA untuk invoice belum lunas berumur H+10, diulang tiap 7 hari (08:00 WIB)"
    cron: "0 1 * * *"
    endpoint: "{{BASE_URL}}/api/cron/invoice-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
